[project]
name = "video-generation-pipeline"
version = "0.1.0"
description = "Multi-model video generation API backed by on-demand Modal workers"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "modal>=1.2,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "boto3>=1.35,<2",
    "psycopg[binary]>=3.2,<4",
    "Pillow>=11,<13",
    "huggingface-hub>=0.36,<2",
    "uvicorn>=0.30,<1",
    "python-dotenv>=1,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
mcp = ["fastmcp>=4,<5", "httpx>=0.27,<1"]
