name: CI/CD - Test, Build, Push, and Deploy

on:
  push:
    branches:
      - main # Deploy on main
  pull_request:
    branches:
      - main # Run tests on PR to main

env:
  REGISTRY: ghcr.io

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # needed for GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- Python tests for PR + main ----------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install --upgrade pip
          pip install -r requirements.txt
          # test + mcp extras used by the test suite (pytest, httpx, fastmcp)
          pip install pytest httpx "fastmcp>=4,<5"
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run tests
        run: |
          python -m compileall -q src modal_app.py
          python -m pytest -q

      # ---------- Build Docker image (push only on main) ----------
      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login only for push -> main (we don't push on PRs)
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and (conditionally) push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Only push on main; on PRs we just build to verify Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          platforms: linux/amd64
          tags: |
            ${{ steps.version.outputs.image_name }}:latest
            ${{ steps.version.outputs.image_name }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image_name }}:${{ steps.version.outputs.version }}-${{ github.sha }}

      # ---------- Trigger Render deploy ONLY on push to main ----------
      - name: Trigger Render deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Render deploy hook is not configured; skipping deploy."
            exit 0
          fi
          # Build full image tag with version
          IMAGE_TAG="${{ steps.version.outputs.version }}"
          FULL_IMAGE="${{ steps.version.outputs.image_name }}:${IMAGE_TAG}"

          echo "Triggering Render deploy with image: $FULL_IMAGE"

          ENCODED_IMG_URL=$(python - << 'PY'
          import urllib.parse, os
          image = os.environ["FULL_IMAGE"]
          print(urllib.parse.quote(image, safe=''))
          PY
          )

          curl --fail-with-body -X POST "${RENDER_DEPLOY_HOOK_URL}&imgURL=${ENCODED_IMG_URL}"
        env:
          FULL_IMAGE: ${{ steps.version.outputs.image_name }}:${{ steps.version.outputs.version }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
